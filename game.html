<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MEGA BLASTER X</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:'Press Start 2P',monospace; touch-action: none; }
  #wrap { width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#000; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; width:100%; height:100%; object-fit:contain; background:#000; }
  
  #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
  #editorBar { position: absolute; top: 0; left: 0; width: 100%; min-height: 40px; background: rgba(26,26,46,0.95); border-bottom: 2px solid #4a9aff; display: none; pointer-events: auto; align-items: center; padding: 3px 5px; gap: 2px; flex-wrap: wrap; }
  #editorBar button { font-family: 'Press Start 2P'; font-size: 6px; padding: 4px 4px; background: #4a9aff; color: #000; border: none; cursor: pointer; white-space: nowrap; }
  #editorBar button:hover { background: #66b3ff; }
  #editorBar button.active { background: #ffee44; }
  #editorBar button.danger { background: #ff4444; color: #fff; }
  #editorBar button.toggle { background: #333; color: #888; }
  #editorBar button.toggle.on { background: #44ff44; color: #000; }
  #editorBar label { font-size: 6px; color: #fff; font-family: 'Press Start 2P'; }
  #editorBar input[type="range"] { width: 50px; }
  #fileInput { display: none; }

  /* Mobile/Android Controls - Bigger, Better D-Pad */
  #touchUI { position: absolute; bottom: 0; left: 0; width: 100%; height: 300px; pointer-events: none; display: none; z-index: 30; }
  @media (pointer: coarse), (max-width: 900px) { #touchUI { display: block; } }
  .touchBtn { position: absolute; pointer-events: auto; background: rgba(40,40,60,.7); border: 2px solid rgba(100,150,255,.8); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; touch-action: none; width: 70px; height: 70px; box-shadow: 0 0 10px rgba(0,0,0,.5); }
  
  /* D-Pad Layout */
  #tUp { left: 30px; bottom: 160px; border-radius: 10px; width: 60px; height: 60px; }
  #tDown { left: 30px; bottom: 40px; border-radius: 10px; width: 60px; height: 60px; }
  #tLeft { left: 90px; bottom: 100px; border-radius: 10px; width: 60px; height: 60px; }
  #tRight { left: 150px; bottom: 100px; border-radius: 10px; width: 60px; height: 60px; }
  
  /* Action Buttons Layout */
  #tJump { right: 20px; bottom: 120px; width: 80px; height: 80px; font-size: 12px; }
  #tShoot { right: 110px; bottom: 180px; width: 65px; height: 65px; font-size: 12px; }
  #tSword { right: 110px; bottom: 40px; width: 65px; height: 65px; font-size: 12px; }
  #tGuard { right: 180px; bottom: 120px; width: 60px; height: 60px; font-size: 10px; }
  #tGrapple { right: 20px; bottom: 210px; width: 60px; height: 60px; font-size: 10px; } /* Swing */
  #tStim { left: 100px; bottom: 210px; width: 60px; height: 60px; font-size: 10px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <input type="file" id="fileInput">
  <div id="uiLayer">
    <div id="editorBar">
      <button onclick="game.setTool(1)" id="tool1" class="active">BLK</button>
      <button onclick="game.setTool(2)" id="tool2">PLT</button>
      <button onclick="game.setTool(3)" id="tool3">SPK</button>
      <button onclick="game.setTool(4)" id="tool4">GOL</button>
      <button onclick="game.setTool(15)" id="tool15">CP</button>
      <button onclick="game.setTool(14)" id="tool14">SWNG</button>
      <button onclick="game.setTool(5)" id="tool5">GUN</button>
      <button onclick="game.setTool(6)" id="tool6">SWD</button>
      <button onclick="game.setTool(7)" id="tool7">FLY</button>
      <button onclick="game.setTool(0)" id="tool0">ERS</button>
      <button onclick="game.toggleCollision()" id="colBtn" class="toggle on">COL</button>
      <label>W:</label>
      <input type="range" min="60" max="500" value="200" id="widthSlider" oninput="game.resizeLevel(this.value)">
      <button onclick="game.playtestLevel()">PLY</button>
      <button onclick="game.saveCustomLevel()">SAV</button>
      <button onclick="game.exitEditor()" class="danger">EXT</button>
    </div>
  </div>
  <div id="touchUI">
    <button class="touchBtn" id="tLeft">◀</button>
    <button class="touchBtn" id="tRight">▶</button>
    <button class="touchBtn" id="tUp">▲</button>
    <button class="touchBtn" id="tDown">▼</button>
    <button class="touchBtn" id="tJump">JMP</button>
    <button class="touchBtn" id="tShoot">SHT</button>
    <button class="touchBtn" id="tSword">SWD</button>
    <button class="touchBtn" id="tGuard">GRD</button>
    <button class="touchBtn" id="tGrapple">SWNG</button>
    <button class="touchBtn" id="tStim">STM</button>
  </div>
</div>
<script>
"use strict";
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 960, H = 540, TILE = 32;

function bindTouch(id, key) {
  const el = document.getElementById(id); if(!el) return;
  const press = (e) => { e.preventDefault(); Input.keys[key] = true; Input.kp[key] = true; AC.init(); };
  const release = (e) => { e.preventDefault(); Input.keys[key] = false; };
  el.addEventListener('touchstart', press, {passive: false}); el.addEventListener('touchend', release, {passive: false});
  el.addEventListener('touchcancel', release, {passive: false}); el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release); el.addEventListener('mouseleave', release);
}

const THEMES = [
  {n:'INDUSTRIAL',bg:'#1a1428',bg2:'#0d0a18',tl:'#5a4a6a',tl2:'#3a3045',ac:'#ff6b3d',gl:'#ff8c5a',dg:'#ff3344',fg:'#2a1f3a',mel:[220,246.94,261.63,293.66,329.63,392],bass:[110,146.83,164.81],bpm:140},
  {n:'ICE',bg:'#0a1a2e',bg2:'#050d1a',tl:'#3a6a9a',tl2:'#2a4a6a',ac:'#6bcfff',gl:'#9ee0ff',dg:'#ff5577',fg:'#1a2a3e',mel:[261.63,311.13,349.23,392,466.16,523.25],bass:[130.81,174.61,196],bpm:150},
  {n:'FIRE',bg:'#2a0a0a',bg2:'#1a0505',tl:'#8a3a2a',tl2:'#5a2010',ac:'#ffaa33',gl:'#ffcc66',dg:'#ff2200',fg:'#3a1515',mel:[164.81,196,220,246.94,293.66,329.63],bass:[82.41,110,130.81],bpm:160},
  {n:'JUNGLE',bg:'#0a1f0a',bg2:'#051005',tl:'#3a6a3a',tl2:'#2a4a2a',ac:'#66dd44',gl:'#99ee77',dg:'#ff4466',fg:'#1a2a1a',mel:[196,220,261.63,293.66,329.63,392],bass:[98,130.81,146.83],bpm:120},
  {n:'SKY',bg:'#1a2a4e',bg2:'#0a152a',tl:'#5a7aaa',tl2:'#3a5a7a',ac:'#88ddff',gl:'#aaeeff',dg:'#ff6644',fg:'#2a3a5a',mel:[293.66,349.23,392,440,523.25,587.33],bass:[146.83,196,220],bpm:130},
  {n:'CYBER',bg:'#1a0a2a',bg2:'#0d0518',tl:'#6a3a8a',tl2:'#4a2a5a',ac:'#ff44dd',gl:'#aa77ff',dg:'#ff3366',fg:'#2a1a3a',mel:[220,261.63,311.13,349.23,415.30,466.16],bass:[110,130.81,164.81],bpm:145}
];
const ROCK_THEME = { mel: [82.41, 98, 110, 146.83, 164.81, 196], bass: [41.2, 55, 65.41], bpm: 170, type: 'sawtooth' }; // E Minor Rock
const BOSS_NAMES = ['','COGMASTER','FROSTBITE','INFERNO','VINECREEP','STORMWING','DEPTHKING','SANDSCORCH','GRIDLORD','OMEGA','MEGA EMPEROR'];
const Save = { k:'mbx_v10', slots: [null, null, null],
  load(){ try { const d = localStorage.getItem(this.k); if(d) this.slots = JSON.parse(d); } catch(e){} },
  save(){ try { localStorage.setItem(this.k, JSON.stringify(this.slots)); } catch(e){ alert('Save failed!'); } },
  newSlot(i){ this.slots[i] = { hu:1, cmp:[], sc:0, time:0, name:'SLOT '+(i+1), customLevels:[] }; this.save(); } };
Save.load();

function rng(seed){ let s=seed|0; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
const AC = { ctx:null, init(){ if(!this.ctx) try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  play(f,d,t='square',v=.05,p=1){AC.init();if(!AC.ctx)return;const o=AC.ctx.createOscillator(),g=AC.ctx.createGain();o.type=t;o.frequency.value=f*p;g.gain.setValueAtTime(v,AC.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.ctx.currentTime+d);o.connect(g);g.connect(AC.ctx.destination);o.start();o.stop(AC.ctx.currentTime+d);},
  noise(d,v=.06){if(!AC.ctx)return;const b=AC.ctx.createBuffer(1,AC.ctx.sampleRate*d,AC.ctx.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*Math.exp(-i/dt.length*4);const s=AC.ctx.createBufferSource();s.buffer=b;const g=AC.ctx.createGain();g.gain.value=v;s.connect(g);g.connect(AC.ctx.destination);s.start();} };
const SFX = {
  shoot(){ AC.play(880,.06,'square',.04); }, sword(){ AC.noise(.1,.05); AC.play(200,.08,'sawtooth',.03); },
  jump(p=1){ AC.play(440,.08,'square',.05,p); }, wallJump(){ AC.play(550,.06,'square',.05); setTimeout(()=>AC.play(880,.08,'square',.04),30); },
  stompBounce(){ AC.play(300,.1,'square',.06); setTimeout(()=>AC.play(800,.15,'square',.06),30); },
  stompGround(){ AC.play(80,.3,'sawtooth',.12); AC.noise(.4,.1); },
  enemyDie(){ AC.play(150,.2,'sawtooth',.06); setTimeout(()=>AC.noise(.2,.06),50); },
  damage(){ AC.play(100,.3,'sawtooth',.08); }, guard(){ AC.play(400,.05,'square',.04); AC.noise(.05,.04); },
  guardBreak(){ AC.play(80,.4,'sawtooth',.1); AC.noise(.3,.08); },
  stim(){ AC.play(523,.1,'sine',.05); setTimeout(()=>AC.play(659,.1,'sine',.05),80); setTimeout(()=>AC.play(784,.15,'sine',.05),160); },
  complete(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>AC.play(f,.15,'square',.06),i*100)); },
  select(){ AC.play(660,.05,'square',.03); }, boost(){ AC.play(120,.15,'sawtooth',.05); AC.noise(.1,.04); },
  explosion(){ AC.play(60,.3,'sawtooth',.12); AC.noise(.4,.1); },
  invinc(){ AC.play(523,.2,'square',.08); setTimeout(()=>AC.play(784,.2,'square',.08),100); setTimeout(()=>AC.play(1047,.4,'square',.1),200); },
  cheat(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>AC.play(f,.2,'square',.08),i*80)); } };
const Music = { ctx:null, isPlaying:false, interval:null, theme:null, step:0,
  init(){ if(!this.ctx) try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  play(theme) { this.init(); if(!this.ctx || !theme) return; this.stop(); this.theme = theme; this.isPlaying = true; this.step = 0;
    const noteLen = 60 / theme.bpm / 4;
    const tick = () => { if(!this.isPlaying) return; const s = this.step % 16;
      if(s % 4 === 0) { const bn = theme.bass[Math.floor(this.step / 4) % theme.bass.length]; this.note(bn, noteLen * 4, 'triangle', 0.08); }
      if(s % 2 === 0 && Math.random() > 0.2) { const mn = theme.mel[Math.floor(Math.random() * theme.mel.length)]; this.note(mn, noteLen * 2, theme.type || 'square', 0.05); }
      if(s % 4 === 2) { const an = theme.mel[Math.floor(this.step / 4) % theme.mel.length] * 2; this.note(an, noteLen, 'sawtooth', 0.03); }
      if(s === 4 || s === 12) AC.noise(0.05, 0.04); if(s === 0 || s === 8) AC.play(60, 0.1, 'sine', 0.1); this.step++; };
    this.interval = setInterval(tick, noteLen * 1000); },
  note(freq, dur, type, vol) { if(!this.ctx) return; const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + dur); },
  stop() { this.isPlaying = false; if(this.interval) clearInterval(this.interval); } };

const Input = {
  keys:{}, kp:{}, gp:null, gpb:{}, gpbp:{}, prevGpb:{}, axes:{lx:0,ly:0,rx:0,ry:0}, mx:0,my:0, mDown:false, rDown:false,
  lastTap:{left:0,right:0}, _pl:false, _pr:false,
  init(){
    window.addEventListener('keydown',e=>{ if(!this.keys[e.code]) this.kp[e.code]=true; this.keys[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
    window.addEventListener('keyup',e=>{ this.keys[e.code]=false; });
    cv.addEventListener('mousemove',e=>{ const r=cv.getBoundingClientRect(); this.mx=(e.clientX-r.left)*(W/r.width); this.my=(e.clientY-r.top)*(H/r.height); });
    cv.addEventListener('mousedown',e=>{ AC.init(); if(e.button===2) this.rDown=true; else this.mDown=true; });
    cv.addEventListener('mouseup',e=>{ this.mDown=false; this.rDown=false; });
    cv.addEventListener('contextmenu',e=>{ e.preventDefault(); });
    bindTouch('tLeft', 'ArrowLeft'); bindTouch('tRight', 'ArrowRight'); bindTouch('tDown', 'ArrowDown'); bindTouch('tUp', 'ArrowUp');
    bindTouch('tJump', 'Space'); bindTouch('tShoot', 'KeyX'); bindTouch('tSword', 'KeyZ');
    bindTouch('tSlide', 'KeyS'); bindTouch('tGuard', 'ShiftLeft'); bindTouch('tGrapple', 'KeyE'); bindTouch('tStim', 'KeyQ');
  },
  update(){
    const pads=navigator.getGamepads?navigator.getGamepads():[];
    this.gp=pads[0]||null; this.prevGpb={...this.gpb};
    if(this.gp){ for(let i=0;i<this.gp.buttons.length;i++) this.gpb[i]=this.gp.buttons[i].pressed;
      this.axes.lx=this.gp.axes[0]||0; this.axes.ly=this.gp.axes[1]||0; this.axes.rx=this.gp.axes[2]||0; this.axes.ry=this.gp.axes[3]||0;
      if(Math.abs(this.axes.lx)<.1&&Math.abs(this.axes.ly)<.1){ if(this.gpb[14])this.axes.lx=-1; if(this.gpb[15])this.axes.lx=1; if(this.gpb[12])this.axes.ly=-1; if(this.gpb[13])this.axes.ly=1; } }
    this.gpbp={}; if(this.gp) for(let i=0;i<this.gp.buttons.length;i++) if(this.gpb[i]&&!this.prevGpb[i]) this.gpbp[i]=true;
    if(this.gp){ const lt=this.gp.buttons[6]?.value||0, rt=this.gp.buttons[7]?.value||0; if(lt>.3)this.gpb[6]=true; if(lt<=.3)this.gpb[6]=false; if(rt>.3)this.gpb[7]=true; if(rt<=.3)this.gpb[7]=false; }
  },
  postUpdate(){ this.kp={}; },
  left(){ return this.keys.ArrowLeft||this.keys.KeyA||(this.axes.lx<-.3); },
  right(){ return this.keys.ArrowRight||this.keys.KeyD||(this.axes.lx>.3); },
  up(){ return this.keys.ArrowUp||this.keys.KeyW||(this.axes.ly<-.3); },
  down(){ return this.keys.ArrowDown||this.keys.KeyS||(this.axes.ly>.3); },
  jumpPressed(){ return this.kp.Space||this.gpbp[0]; },
  shootHeld(){ return this.keys.KeyX||this.gpb[7]; },
  swordPressed(){ return this.kp.KeyZ||this.gpbp[2]; },
  slidePressed(){ return this.kp.KeyS||this.gpbp[13]; },
  stompPressed(){ return this.kp.KeyC||this.gpbp[1]; },
  stimPressed(){ return this.kp.KeyQ||this.gpbp[4]; },
  swingPressed(){ return this.kp.KeyE||this.gpbp[6]; }, // L2
  guardHeld(){ return this.keys.ShiftLeft||this.gpb[5]; },
  invincibilityPressed(){ return this.kp.KeyV||this.gpbp[10]; },
  startPressed(){ return this.kp.Enter||this.gpbp[9]||this.kp.Space||this.gpbp[0]; },
  confirmPressed(){ return this.kp.Enter||this.kp.Space||this.gpbp[0]; },
  anyPressed(){ return Object.keys(this.kp).length>0||Object.keys(this.gpbp).length>0; },
  checkDoubleTap(){ const n=performance.now(); let b=0; if(this.left()&&!this._pl){const t=n-this.lastTap.left;if(t<250&&t>0)b=-1;this.lastTap.left=n;this._pl=true;} if(!this.left())this._pl=false; if(this.right()&&!this._pr){const t=n-this.lastTap.right;if(t<250&&t>0)b=1;this.lastTap.right=n;this._pr=true;} if(!this.right())this._pr=false; return b; }
};

const TILE_SOLID=1, TILE_ONEWAY=2, TILE_SPIKE=3, TILE_GOAL=4, TILE_CP=15, TILE_SWING=14;
const ENEMY_TYPES = { 5:'gunner', 6:'swordsman', 7:'flier', 8:'jumper' };

function genLevel(num){
  const r=rng(num*7919+42); const ti=(num-1)%6; const th=THEMES[ti]; const isBoss=num%5===0;
  if(isBoss) return genBoss(num,th,r);
  const lw=300+num*10; const lh=17; const g=Array.from({length:lh},()=>new Array(lw).fill(0));
  let x=0; while(x<lw){ const s=3+Math.floor(r()*6); for(let i=0;i<s&&x<lw;i++){g[lh-1][x]=1;x++;} if(r()<.4&&x<lw-6){ const gap=3+Math.floor(r()*5); for(let i=0;i<gap&&x<lw;i++){g[lh-1][x]=0;x++;} } }
  for(let i=0;i<4;i++){g[lh-1][i]=1;}
  for(let i=0;i<30+num;i++){ const px=4+Math.floor(r()*(lw-8)), py=3+Math.floor(r()*(lh-6)), pl=1+Math.floor(r()*3); for(let j=0;j<pl&&px+j<lw;j++) if(g[py][px+j]===0) g[py][px+j]=2; }
  for(let i=0;i<20+num;i++){ const sx=5+Math.floor(r()*(lw-10)); if(g[lh-1][sx]===1&&g[lh-2][sx]===0) g[lh-2][sx]=3; }
  // Checkpoints
  for(let i=0;i<5;i++){ const cpx=50+Math.floor(r()*(lw-100)); if(g[lh-2][cpx]===0) g[lh-2][cpx]=15; }
  // Swing Poles
  for(let i=0;i<10+num;i++){ const spx=10+Math.floor(r()*(lw-20)); const spy=4+Math.floor(r()*(lh-8)); if(g[spy][spx]===0) g[spy][spx]=14; }
  const wjc=Math.min(10, Math.floor(num/2)+1);
  for(let i=0;i<wjc;i++){ const sx=30+Math.floor(r()*(lw-60)), gap=4, lw2=sx, rw=sx+gap+1; for(let y=lh-1;y>=lh-14;y--){ for(let dx=0;dx<=gap+1;dx++){ if(sx+dx<lw&&g[y]) g[y][sx+dx]=0; } } for(let y=lh-2;y>=lh-14;y--){ if(g[y]){ g[y][lw2]=1; if(rw<lw) g[y][rw]=1; } } for(let dx=-1;dx<=gap+2;dx++){ if(sx+dx>=0&&sx+dx<lw&&g[lh-15]) g[lh-15][sx+dx]=1; } if(g[lh-15]&&rw+1<lw){ g[lh-15][rw+1]=0; g[lh-15][rw+2]=0; } if(g[lh-16]&&rw+1<lw){ g[lh-16][rw+1]=1; if(rw+2<lw) g[lh-16][rw+2]=1; } }
  let gx=lw-2; while(g[lh-1][gx]!==1&&gx>0)gx--; g[lh-2][gx]=4;
  const en=[]; for(let i=0;i<20+num*2;i++){ const ex=6+Math.floor(r()*(lw-12)); let ey=lh-3; for(let y=lh-1;y>=0;y--){ if(g[y][ex]===1){ey=y-2;break;} } const types=['gunner','swordsman','flier','sniper','jumper']; if(num>=5)types.push('chaser'); if(num>=10)types.push('turret'); const type=types[Math.floor(r()*types.length)]; if(g[ey]&&g[ey][ex]===0) en.push({x:ex*TILE,y:ey*TILE,type}); }
  return {grid:g,enemies:en,theme:th,width:lw,height:lh,isBoss:false,num,checkpoints:[],startX:TILE*2,startY:(lh-4)*TILE,hasWallJump:wjc>0};
}
function genBoss(num,th,r){
  const lw=32,lh=17; const g=Array.from({length:lh},()=>new Array(lw).fill(0)); for(let x=0;x<lw;x++) g[lh-1][x]=1; for(let y=0;y<lh;y++){g[y][0]=1;g[y][lw-1]=1;} for(let i=0;i<5;i++){ const px=4+Math.floor(r()*22),py=4+Math.floor(r()*8); g[py][px]=2; if(px+1<lw)g[py][px+1]=2; } for(let y=lh-2;y>=lh-6;y--){g[y][3]=1;g[y][lw-4]=1;}
  const bt=Math.floor((num-1)/5)%5; return {grid:g,enemies:[],boss:{x:(lw-4)*TILE,y:(lh-5)*TILE,num,bt},theme:th,width:lw,height:lh,isBoss:true,num,checkpoints:[],startX:TILE*2,startY:(lh-4)*TILE,hasWallJump:true};
}

function isSolid(t){ return t===1; }
function isSpike(t){ return t===3; }

function tileAt(l,x,y){ if(y<0)return 1; if(x<0||x>=l.width)return 1; if(y>=l.height)return 0; return l.grid[y][x]; }

  drawEditor(){ ctx.fillStyle='#111'; ctx.fillRect(0,40,W,H-60); ctx.strokeStyle='rgba(255,255,255,0.1)'; const offX=this.editorCamX%TILE; for(let x=0;x<=W;x+=TILE){ctx.beginPath(); ctx.moveTo(x-offX,40); ctx.lineTo(x-offX,H-20); ctx.stroke();} for(let y=40;y<=H-20;y+=TILE){ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();} const th=THEMES[0], sX=Math.floor(this.editorCamX/TILE), eX=Math.ceil((this.editorCamX+W)/TILE); for(let ty=0;ty<this.editorGrid.length;ty++){ for(let tx=sX;tx<eX;tx++){ if(tx<0||tx>=this.editorGrid[0].length)continue; const t=this.editorGrid[ty][tx]; const dx=tx*TILE-this.editorCamX, dy=ty*TILE+40; if(t===1){ctx.fillStyle=th.tl; ctx.fillRect(dx,dy,TILE,TILE);} else if(t===3){ctx.fillStyle=th.dg; ctx.beginPath(); ctx.moveTo(dx,dy+TILE); ctx.lineTo(dx+TILE/2,dy); ctx.lineTo(dx+TILE,dy+TILE); ctx.fill();} else if(t===4){ctx.fillStyle=th.ac; ctx.fillRect(dx+4,dy-20,TILE-8,TILE+20);} else if(t===14){ ctx.fillStyle='#88ddff'; ctx.beginPath(); ctx.arc(dx+TILE/2, dy+TILE/2, 8, 0, Math.PI*2); ctx.fill(); } else if(t===15){ ctx.fillStyle='#44ff88'; ctx.fillRect(dx+4, dy+4, TILE-8, TILE-8); } } } for(const e of this.editorEnemies){ const dx = e.x - this.editorCamX, dy = e.y + 40; ctx.fillStyle = e.type==='gunner'?'#aa3322':e.type==='swordsman'?'#6622aa':e.type==='flier'?'#6644aa':e.type==='jumper'?'#22aa66':'#aa6622'; ctx.fillRect(dx+2,dy+8,20,14); } if(Input.my>40 && Input.my<H-20){ const tx=Math.floor((Input.mx+this.editorCamX)/TILE), ty=Math.floor((Input.my-40)/TILE); ctx.globalAlpha=0.5; ctx.fillStyle=this.editorTool===1?th.tl:this.editorTool===3?th.dg:this.editorTool===4?th.ac:'#fff'; ctx.fillRect(tx*TILE-this.editorCamX,ty*TILE+40,TILE,TILE); ctx.globalAlpha=1; } },
