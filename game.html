<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MEGA BLASTER X</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Press Start 2P',monospace;
        }

        #wrap {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg,#0a0a14,#1a0a2a);
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            background: #000;
            box-shadow: 0 0 40px rgba(80,40,160,.4);
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        #editorBar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 50px;
            background: rgba(26,26,46,0.95);
            border-bottom: 2px solid #4a9aff;
            display: none;
            pointer-events: auto;
            align-items: center;
            padding: 5px 10px;
            gap: 3px;
            flex-wrap: wrap;
        }

            #editorBar button {
                font-family: 'Press Start 2P';
                font-size: 7px;
                padding: 5px 6px;
                background: #4a9aff;
                color: #000;
                border: none;
                cursor: pointer;
                white-space: nowrap;
            }

                #editorBar button:hover {
                    background: #66b3ff;
                }

                #editorBar button.active {
                    background: #ffee44;
                }

                #editorBar button.danger {
                    background: #ff4444;
                    color: #fff;
                }

                #editorBar button.toggle {
                    background: #333;
                    color: #888;
                }

                    #editorBar button.toggle.on {
                        background: #44ff44;
                        color: #000;
                    }

            #editorBar label {
                font-size: 7px;
                color: #fff;
                font-family: 'Press Start 2P';
            }

            #editorBar input[type="range"] {
                width: 70px;
            }

        #fileInput {
            display: none;
        }

        #spritePreview {
            position: absolute;
            top: 55px;
            right: 10px;
            width: 200px;
            max-height: 300px;
            background: rgba(0,0,0,0.9);
            border: 2px solid #4a9aff;
            display: none;
            pointer-events: auto;
            padding: 5px;
            z-index: 30;
        }

            #spritePreview canvas {
                max-width: 100%;
                max-height: 280px;
            }

            #spritePreview button {
                font-family: 'Press Start 2P';
                font-size: 7px;
                padding: 4px;
                background: #4a9aff;
                color: #000;
                border: none;
                cursor: pointer;
                margin-top: 3px;
                width: 100%;
            }

        #touchUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        @media (pointer: coarse) {
            #touchUI {
                display: block;
            }
        }

        .touchBtn {
            position: absolute;
            pointer-events: auto;
            background: rgba(30,30,50,.6);
            border: 2px solid rgba(100,150,255,.6);
            color: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            user-select: none;
            touch-action: none;
            width: 55px;
            height: 55px;
        }

        #tLeft {
            left: 20px;
            bottom: 80px;
        }

        #tRight {
            left: 85px;
            bottom: 80px;
        }

        #tDown {
            left: 52px;
            bottom: 25px;
        }

        #tUp {
            left: 117px;
            bottom: 80px;
        }

        #tJump {
            right: 20px;
            bottom: 80px;
        }

        #tShoot {
            right: 85px;
            bottom: 80px;
        }

        #tSword {
            right: 150px;
            bottom: 80px;
        }

        #tSlide {
            right: 117px;
            bottom: 25px;
        }

        #tGuard {
            right: 20px;
            bottom: 145px;
        }

        #tGrapple {
            right: 85px;
            bottom: 145px;
        }

        #tStim {
            right: 150px;
            bottom: 145px;
        }

        #tGrenade {
            right: 215px;
            bottom: 145px;
        }

        #tInvinc {
            right: 215px;
            bottom: 80px;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <canvas id="c" width="960" height="540"></canvas>
        <input type="file" id="fileInput">
        <div id="uiLayer">
            <div id="editorBar">
                <button onclick="game.setTool(1)" id="tool1" class="active">BLK</button>
                <button onclick="game.setTool(2)" id="tool2">PLT</button>
                <button onclick="game.setTool(3)" id="tool3">SPK</button>
                <button onclick="game.setTool(4)" id="tool4">GOL</button>
                <button onclick="game.setTool(5)" id="tool5">GUN</button>
                <button onclick="game.setTool(6)" id="tool6">SWD</button>
                <button onclick="game.setTool(7)" id="tool7">FLY</button>
                <button onclick="game.setTool(8)" id="tool8">JMP</button>
                <button onclick="game.setTool(9)" id="tool9">BMB</button>
                <button onclick="game.setTool(12)" id="tool12">IMG</button>
                <button onclick="game.setTool(0)" id="tool0">ERS</button>
                <button onclick="game.toggleCollision()" id="colBtn" class="toggle on">COL:ON</button>
                <label>W:</label>
                <input type="range" min="60" max="500" value="200" id="widthSlider" oninput="game.resizeLevel(this.value)">
                <button onclick="game.editorUpload('bg')">BG</button>
                <button onclick="game.editorUpload('music')">MUS</button>
                <button onclick="game.editorUpload('parallax1')">PX1</button>
                <button onclick="game.editorUpload('spriteSheet')">SPR</button>
                <button onclick="game.playtestLevel()">PLY</button>
                <button onclick="game.saveCustomLevel()">SAV</button>
                <button onclick="game.exportLevel()">EXP</button>
                <button onclick="game.importLevel()">IMP</button>
                <button onclick="game.selectAll()">SEL</button>
                <button onclick="game.clearAll()">CLR</button>
                <button onclick="game.exitEditor()" class="danger">EXT</button>
            </div>
            <div id="spritePreview">
                <canvas id="spriteCanvas" width="192" height="192"></canvas>
                <button onclick="document.getElementById('spritePreview').style.display='none'">CLOSE</button>
            </div>
        </div>
        <div id="touchUI">
            <button class="touchBtn" id="tLeft">◀</button> <button class="touchBtn" id="tRight">▶</button>
            <button class="touchBtn" id="tDown">▼</button> <button class="touchBtn" id="tUp">▲</button>
            <button class="touchBtn" id="tJump">JMP</button> <button class="touchBtn" id="tShoot">SHT</button>
            <button class="touchBtn" id="tSword">SWD</button> <button class="touchBtn" id="tSlide">SLD</button>
            <button class="touchBtn" id="tGuard">GRD</button> <button class="touchBtn" id="tGrapple">GRP</button>
            <button class="touchBtn" id="tStim">STM</button> <button class="touchBtn" id="tGrenade">GRN</button>
            <button class="touchBtn" id="tInvinc">INV</button>
        </div>
    </div>
    <script>
        "use strict";
        const cv = document.getElementById('c');
        const ctx = cv.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        const W = 960, H = 540, TILE = 32;
        function bindTouch(id, key) {
            const el = document.getElementById(id); if (!el) return;
            const press = (e) => { e.preventDefault(); Input.keys[key] = true; Input.kp[key] = true; AC.init(); };
            const release = (e) => { e.preventDefault(); Input.keys[key] = false; };
            el.addEventListener('touchstart', press, { passive: false }); el.addEventListener('touchend', release, { passive: false });
            el.addEventListener('touchcancel', release, { passive: false }); el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release); el.addEventListener('mouseleave', release);
        }
        const THEMES = [
            { n: 'INDUSTRIAL', bg: '#1a1428', bg2: '#0d0a18', tl: '#5a4a6a', tl2: '#3a3045', ac: '#ff6b3d', gl: '#ff8c5a', dg: '#ff3344', fg: '#2a1f3a', mel: [220, 246.94, 261.63, 293.66, 329.63, 392], bass: [110, 146.83, 164.81], bpm: 140 },
            { n: 'ICE', bg: '#0a1a2e', bg2: '#050d1a', tl: '#3a6a9a', tl2: '#2a4a6a', ac: '#6bcfff', gl: '#9ee0ff', dg: '#ff5577', fg: '#1a2a3e', mel: [261.63, 311.13, 349.23, 392, 466.16, 523.25], bass: [130.81, 174.61, 196], bpm: 150 },
            { n: 'FIRE', bg: '#2a0a0a', bg2: '#1a0505', tl: '#8a3a2a', tl2: '#5a2010', ac: '#ffaa33', gl: '#ffcc66', dg: '#ff2200', fg: '#3a1515', mel: [164.81, 196, 220, 246.94, 293.66, 329.63], bass: [82.41, 110, 130.81], bpm: 160 },
            { n: 'JUNGLE', bg: '#0a1f0a', bg2: '#051005', tl: '#3a6a3a', tl2: '#2a4a2a', ac: '#66dd44', gl: '#99ee77', dg: '#ff4466', fg: '#1a2a1a', mel: [196, 220, 261.63, 293.66, 329.63, 392], bass: [98, 130.81, 146.83], bpm: 120 },
            { n: 'SKY', bg: '#1a2a4e', bg2: '#0a152a', tl: '#5a7aaa', tl2: '#3a5a7a', ac: '#88ddff', gl: '#aaeeff', dg: '#ff6644', fg: '#2a3a5a', mel: [293.66, 349.23, 392, 440, 523.25, 587.33], bass: [146.83, 196, 220], bpm: 130 },
            { n: 'CYBER', bg: '#1a0a2a', bg2: '#0d0518', tl: '#6a3a8a', tl2: '#4a2a5a', ac: '#ff44dd', gl: '#aa77ff', dg: '#ff3366', fg: '#2a1a3a', mel: [220, 261.63, 311.13, 349.23, 415.30, 466.16], bass: [110, 130.81, 164.81], bpm: 145 }
        ];
        const BOSS_NAMES = ['', 'COGMASTER', 'FROSTBITE', 'INFERNO', 'VINECREEP', 'STORMWING', 'DEPTHKING', 'SANDSCORCH', 'GRIDLORD', 'OMEGA', 'MEGA EMPEROR'];
        // Rock theme for opening cutscene
        const ROCK = { chords: [[82.41, 123.47], [98.00, 146.83], [110.00, 164.81], [82.41, 123.47]], lead: [329.63, 392.00, 440.00, 493.88, 587.33, 659.25], bass: [82.41, 82.41, 98.00, 110.00], bpm: 165 };
        const Save = {
            k: 'mbx_v10', slots: [null, null, null],
            load() { try { const d = localStorage.getItem(this.k); if (d) this.slots = JSON.parse(d); } catch (e) { } },
            save() { try { localStorage.setItem(this.k, JSON.stringify(this.slots)); } catch (e) { alert('Save failed! Storage full.'); } },
            newSlot(i) { this.slots[i] = { hu: 1, cmp: [], sc: 0, time: 0, name: 'SLOT ' + (i + 1), customLevels: [] }; this.save(); }
        };
        Save.load();
        function rng(seed) { let s = seed | 0; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
        const AC = {
            ctx: null, init() { if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } },
            play(f, d, t = 'square', v = .05, p = 1) { AC.init(); if (!AC.ctx) return; const o = AC.ctx.createOscillator(), g = AC.ctx.createGain(); o.type = t; o.frequency.value = f * p; g.gain.setValueAtTime(v, AC.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.ctx.currentTime + d); o.connect(g); g.connect(AC.ctx.destination); o.start(); o.stop(AC.ctx.currentTime + d); },
            noise(d, v = .06) { if (!AC.ctx) return; const b = AC.ctx.createBuffer(1, AC.ctx.sampleRate * d, AC.ctx.sampleRate), dt = b.getChannelData(0); for (let i = 0; i < dt.length; i++)dt[i] = (Math.random() * 2 - 1) * Math.exp(-i / dt.length * 4); const s = AC.ctx.createBufferSource(); s.buffer = b; const g = AC.ctx.createGain(); g.gain.value = v; s.connect(g); g.connect(AC.ctx.destination); s.start(); }
        };
        const SFX = {
            shoot() { AC.play(880, .06, 'square', .04); }, sword() { AC.noise(.1, .05); AC.play(200, .08, 'sawtooth', .03); },
            jump(p = 1) { AC.play(440, .08, 'square', .05, p); }, wallJump() { AC.play(550, .06, 'square', .05); setTimeout(() => AC.play(880, .08, 'square', .04), 30); },
            stompBounce() { AC.play(300, .1, 'square', .06); setTimeout(() => AC.play(800, .15, 'square', .06), 30); },
            stompGround() { AC.play(80, .3, 'sawtooth', .12); AC.noise(.4, .1); },
            enemyDie() { AC.play(150, .2, 'sawtooth', .06); setTimeout(() => AC.noise(.2, .06), 50); },
            damage() { AC.play(100, .3, 'sawtooth', .08); }, guard() { AC.play(400, .05, 'square', .04); AC.noise(.05, .04); },
            guardBreak() { AC.play(80, .4, 'sawtooth', .1); AC.noise(.3, .08); },
            stim() { AC.play(523, .1, 'sine', .05); setTimeout(() => AC.play(659, .1, 'sine', .05), 80); setTimeout(() => AC.play(784, .15, 'sine', .05), 160); },
            grapple() { AC.play(200, .15, 'sawtooth', .04); },
            complete() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => AC.play(f, .15, 'square', .06), i * 100)); },
            boss() { AC.play(80, .5, 'sawtooth', .1); setTimeout(() => AC.play(60, .5, 'sawtooth', .08), 200); },
            select() { AC.play(660, .05, 'square', .03); }, boost() { AC.play(120, .15, 'sawtooth', .05); AC.noise(.1, .04); },
            explosion() { AC.play(60, .3, 'sawtooth', .12); AC.noise(.4, .1); },
            invinc() { AC.play(523, .2, 'square', .08); setTimeout(() => AC.play(784, .2, 'square', .08), 100); setTimeout(() => AC.play(1047, .4, 'square', .1), 200); },
            cheat() { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => AC.play(f, .2, 'square', .08), i * 80)); }
        };
        const Music = {
            ctx: null, isPlaying: false, interval: null, theme: null, step: 0,
            init() { if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } },
            play(theme) {
                this.init(); if (!this.ctx || !theme) return; this.stop(); this.theme = theme; this.isPlaying = true; this.step = 0;
                const noteLen = 60 / theme.bpm / 4;
                const tick = () => {
                    if (!this.isPlaying) return; const s = this.step % 16;
                    if (s % 4 === 0) { const bn = theme.bass[Math.floor(this.step / 4) % theme.bass.length]; this.note(bn, noteLen * 4, 'triangle', 0.06); }
                    if (s % 2 === 0 && Math.random() > 0.3) { const mn = theme.mel[Math.floor(Math.random() * theme.mel.length)]; this.note(mn, noteLen * 2, 'square', 0.04); }
                    if (s % 4 === 2) { const an = theme.mel[Math.floor(this.step / 4) % theme.mel.length] * 2; this.note(an, noteLen, 'sawtooth', 0.02); }
                    if (s === 4 || s === 12) AC.noise(0.05, 0.03); if (s === 0 || s === 8) AC.play(60, 0.1, 'sine', 0.08); this.step++;
                };
                this.interval = setInterval(tick, noteLen * 1000);
            },
            note(freq, dur, type, vol) { if (!this.ctx) return; const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + dur); },
            playRock() {
                this.init(); if (!this.ctx) return; this.stop(); this.isPlaying = true; this.step = 0;
                const nl = 60 / ROCK.bpm / 4;
                this.interval = setInterval(() => {
                    if (!this.isPlaying) return;
                    const s = this.step % 32, ci = Math.floor(this.step / 8) % 4;
                    if (s % 8 === 0 || s % 8 === 4) { ROCK.chords[ci].forEach(f => this.note(f, nl * 4, 'sawtooth', 0.07)); }
                    if (s % 4 === 0) this.note(ROCK.bass[ci], nl * 3, 'triangle', 0.1);
                    if (s % 2 === 0 && Math.random() > 0.2) this.note(ROCK.lead[Math.floor(Math.random() * ROCK.lead.length)], nl * 2, 'square', 0.04);
                    if (s % 4 === 0) AC.play(55, 0.08, 'sine', 0.15);
                    if (s % 4 === 2) AC.noise(0.04, 0.08);
                    if (s % 2 === 1) AC.noise(0.015, 0.02);
                    this.step++;
                }, nl * 1000);
            },
            stop() { this.isPlaying = false; if (this.interval) clearInterval(this.interval); }
        };
        const Input = {
            keys: {}, kp: {}, gp: null, gpb: {}, gpbp: {}, prevGpb: {}, axes: { lx: 0, ly: 0, rx: 0, ry: 0 }, mx: 0, my: 0, mDown: false, rDown: false,
            lastTap: { left: 0, right: 0 }, _pl: false, _pr: false, cheatBuffer: [],
            init() {
                window.addEventListener('keydown', e => {
                    if (e.ctrlKey && e.code === 'KeyA') { e.preventDefault(); if (game.state === 'editor') game.selectAll(); return; }
                    if (e.code === 'Backspace' && game.state === 'editor') { e.preventDefault(); game.clearAll(); return; }
                    if (!this.keys[e.code]) this.kp[e.code] = true; this.keys[e.code] = true;
                    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
                });
                window.addEventListener('keyup', e => { this.keys[e.code] = false; });
                cv.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); this.mx = (e.clientX - r.left) * (W / r.width); this.my = (e.clientY - r.top) * (H / r.height); });
                cv.addEventListener('mousedown', e => { AC.init(); if (e.button === 2) this.rDown = true; else this.mDown = true; });
                cv.addEventListener('mouseup', e => { this.mDown = false; this.rDown = false; });
                cv.addEventListener('contextmenu', e => { e.preventDefault(); });
                bindTouch('tLeft', 'ArrowLeft'); bindTouch('tRight', 'ArrowRight'); bindTouch('tDown', 'ArrowDown'); bindTouch('tUp', 'ArrowUp');
                bindTouch('tJump', 'Space'); bindTouch('tShoot', 'KeyX'); bindTouch('tSword', 'KeyZ');
                bindTouch('tSlide', 'KeyS'); bindTouch('tGuard', 'ShiftLeft'); bindTouch('tGrapple', 'KeyE'); bindTouch('tStim', 'KeyQ');
                bindTouch('tGrenade', 'KeyG'); bindTouch('tInvinc', 'KeyV');
            },
            update() {
                const pads = navigator.getGamepads ? navigator.getGamepads() : [];
                this.gp = pads[0] || null; this.prevGpb = { ...this.gpb };
                if (this.gp) {
                    for (let i = 0; i < this.gp.buttons.length; i++) this.gpb[i] = this.gp.buttons[i].pressed;
                    this.axes.lx = this.gp.axes[0] || 0; this.axes.ly = this.gp.axes[1] || 0; this.axes.rx = this.gp.axes[2] || 0; this.axes.ry = this.gp.axes[3] || 0;
                    if (Math.abs(this.axes.lx) < .1 && Math.abs(this.axes.ly) < .1) { if (this.gpb[14]) this.axes.lx = -1; if (this.gpb[15]) this.axes.lx = 1; if (this.gpb[12]) this.axes.ly = -1; if (this.gpb[13]) this.axes.ly = 1; }
                }
                this.gpbp = {}; if (this.gp) for (let i = 0; i < this.gp.buttons.length; i++) if (this.gpb[i] && !this.prevGpb[i]) this.gpbp[i] = true;
                if (this.gp) { const lt = this.gp.buttons[6]?.value || 0, rt = this.gp.buttons[7]?.value || 0; if (lt > .3) this.gpb[6] = true; if (lt <= .3) this.gpb[6] = false; if (rt > .3) this.gpb[7] = true; if (rt <= .3) this.gpb[7] = false; }
                const seq = ['up', 'up', 'down', 'down', 'left', 'left', 'right', 'right', 'cross', 'circle', 'start'];
                let p = null;
                if (this.kp.ArrowUp) p = 'up'; else if (this.kp.ArrowDown) p = 'down'; else if (this.kp.ArrowLeft) p = 'left'; else if (this.kp.ArrowRight) p = 'right';
                else if (this.kp.Space || this.gpbp[0]) p = 'cross'; else if (this.kp.KeyX || this.gpbp[1]) p = 'circle'; else if (this.kp.Enter || this.gpbp[9]) p = 'start';
                if (p) { this.cheatBuffer.push(p); if (this.cheatBuffer.length > seq.length) this.cheatBuffer.shift(); if (this.cheatBuffer.length === seq.length) { let m = true; for (let i = 0; i < seq.length; i++) { if (this.cheatBuffer[i] !== seq[i]) { m = false; break; } } if (m) { if (game.save) { game.save.hu = 50; game.save.cmp = Array.from({ length: 50 }, (_, i) => i + 1); Save.save(); } game.cheatMsg = 120; SFX.cheat(); this.cheatBuffer = []; } } }
                if (game.state === 'title' && this.gpb[4] && this.gpb[5] && this.gpb[6] && this.gpb[7]) { if (game.save) { game.save.hu = 50; game.save.cmp = Array.from({ length: 50 }, (_, i) => i + 1); Save.save(); } game.cheatMsg = 120; SFX.cheat(); }
            },
            postUpdate() { this.kp = {}; },
            left() { return this.keys.ArrowLeft || this.keys.KeyA || (this.axes.lx < -.3); },
            right() { return this.keys.ArrowRight || this.keys.KeyD || (this.axes.lx > .3); },
            up() { return this.keys.ArrowUp || this.keys.KeyW || (this.axes.ly < -.3); },
            down() { return this.keys.ArrowDown || this.keys.KeyS || (this.axes.ly > .3); },
            jumpPressed() { return this.kp.Space || this.gpbp[0]; },
            shootHeld() { return this.keys.KeyX || this.gpb[7]; },
            swordPressed() { return this.kp.KeyZ || this.gpbp[2]; },
            slidePressed() { return this.kp.KeyS || this.gpbp[13]; },
            stompPressed() { return this.kp.KeyC || this.gpbp[1]; },
            stimPressed() { return this.kp.KeyQ || this.gpbp[4]; },
            grapplePressed() { return this.kp.KeyE || this.gpbp[6]; },
            grenadePressed() { return this.kp.KeyG || this.gpbp[3]; },
            guardHeld() { return this.keys.ShiftLeft || this.gpb[5]; },

                    ctx.fillText('MEGA BLASTER X', W / 2, H / 2);

                    ctx.font = '14px "Press Start 2P"';
